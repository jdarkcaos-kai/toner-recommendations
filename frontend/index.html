<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendaciones de Toner</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background-color: #161b22;
            border-radius: 8px;
            padding: 20px;
            margin: 10px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .button {
            background-color: #58a6ff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .email-section {
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Recomendaciones de Toner</h1>
        <p>Encuentra el toner adecuado para tu impresora de manera rápida y sencilla.</p>
    </header>
    <div class="container">
        <input type="text" id="printerModel" placeholder="Ingresa el modelo de tu impresora" />
        <button class="button" id="searchButton">Buscar Toner</button>
        <div id="recommendations"></div>
    </div>
    <div class="email-section">
        <h2>¿Te interesa este producto?</h2>
        <input type="email" id="emailInput" placeholder="Tu correo electrónico" />
        <button class="button" id="subscribeButton">Quiero acceso anticipado</button>
        <p id="subscriptionMessage"></p>
        <p id="waitlistCount"></p>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/waitlist/count')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('waitlistCount').innerText = `${data.count} personas ya están en la lista`;
                })
                .catch(error => console.error('Error al obtener el contador:', error));

            document.getElementById('searchButton').addEventListener('click', () => {
                const model = document.getElementById('printerModel').value;
                if (!model) {
                    alert('Por favor, ingresa un modelo de impresora.');
                    return;
                }
                fetch(`/recommendations?model=${model}`)
                    .then(response => response.json())
                    .then(data => {
                        const recommendationsDiv = document.getElementById('recommendations');
                        recommendationsDiv.innerHTML = '';
                        if (!data.length) {
                            recommendationsDiv.innerHTML = '<p style="color:#8b949e">Sin resultados. Prueba con: HP LaserJet, Canon PIXMA, Brother HL</p>';
                            return;
                        }
                        data.forEach(t => {
                            const card = document.createElement('div');
                            card.className = 'card';
                            card.innerHTML = `
                                <h3 style="color:#58a6ff;margin:0 0 6px">${t.printer_model}</h3>
                                <p style="margin:4px 0"><strong>Tóner:</strong> ${t.toner_model}</p>
                                <p style="margin:4px 0;color:#8b949e;font-size:13px">Marca: ${t.brand} · Rendimiento: ${t.page_yield}</p>`;
                            recommendationsDiv.appendChild(card);
                        });
                    })
                    .catch(error => {
                        console.error('Error al obtener recomendaciones:', error);
                        alert('Error al obtener recomendaciones. Intenta de nuevo más tarde.');
                    });
            });

            document.getElementById('subscribeButton').addEventListener('click', () => {
                const email = document.getElementById('emailInput').value;
                if (!email) {
                    alert('Por favor, ingresa tu correo electrónico.');
                    return;
                }
                fetch('/waitlist', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('subscriptionMessage').innerText = '¡Anotado! Te avisamos cuando lancemos.';
                    } else {
                        throw new Error('Error al suscribirse.');
                    }
                })
                .catch(error => {
                    console.error('Error al suscribirse:', error);
                    alert('Error al suscribirse. Intenta de nuevo más tarde.');
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendaciones de Toner</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #58a6ff;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 300px;
        }
        button {
            padding: 10px 20px;
            background-color: #58a6ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: #ffffff;
        }
        .card {
            background-color: #161b22;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            width: 300px;
            text-align: center;
        }
        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Recomendaciones de Toner</h1>
        <p>Encuentra el toner adecuado para tu impresora de manera rápida y fácil.</p>
    </header>
    <div class="container">
        <div class="form-group">
            <input type="text" id="printerModel" placeholder="Ej: HP LaserJet Pro M15">
            <button id="searchButton">Buscar Toner</button>
        </div>
        <p style="color:#8b949e;font-size:13px;margin-top:-10px">
            Prueba con: <a href="#" style="color:#58a6ff" onclick="document.getElementById('printerModel').value='HP LaserJet Pro M15'">HP LaserJet Pro M15</a>
            o <a href="#" style="color:#58a6ff" onclick="document.getElementById('printerModel').value='Canon PIXMA MG2520'">Canon PIXMA MG2520</a>
        </p>
        <div id="recommendations"></div>
        <div class="error" id="errorMessage"></div>
    </div>
    <script>
        document.getElementById('searchButton').addEventListener('click', function() {
            const model = document.getElementById('printerModel').value;
            if (!model) {
                document.getElementById('errorMessage').innerText = 'Por favor, ingresa un modelo de impresora.';
                return;
            }
            document.getElementById('errorMessage').innerText = '';
            fetch(`/recommendations/${encodeURIComponent(model)}`)
                .then(response => {
                    if (!response.ok) throw new Error('Error al obtener recomendaciones.');
                    return response.json();
                })
                .then(data => {
                    const recommendationsDiv = document.getElementById('recommendations');
                    recommendationsDiv.innerHTML = '';
                    data.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `<h3>${item.name}</h3><p>${item.description}</p>`;
                        recommendationsDiv.appendChild(card);
                    });
                })
                .catch(error => {
                    document.getElementById('errorMessage').innerText = error.message;
                });
        });
    </script>
</body>
</html>
